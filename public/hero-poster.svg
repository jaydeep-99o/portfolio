<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="wall" cx="62%" cy="38%" r="85%">
      <stop offset="0" stop-color="#e2e2e3"/>
      <stop offset="0.6" stop-color="#c9c9cb"/>
      <stop offset="1" stop-color="#a7a7aa"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f1f2"/>
      <stop offset="1" stop-color="#d4d4d6"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#wall)"/>
  <!-- window-pane shadow cast across the wall -->
  <g transform="translate(980 90) skewX(-18)" fill="#8f8f93" opacity="0.28" filter="url(#soft)">
    <rect x="0" y="0" width="250" height="300"/>
    <rect x="290" y="0" width="250" height="300"/>
    <rect x="0" y="340" width="250" height="300"/>
    <rect x="290" y="340" width="250" height="300"/>
  </g>
  <rect y="860" width="1920" height="220" fill="url(#desk)"/>
  <rect y="860" width="1920" height="3" fill="#b9b9bc" opacity="0.6"/>
</svg>
